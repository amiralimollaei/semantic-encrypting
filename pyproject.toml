[project]
name = "semantic-encrypting"
version = "0.1.0"
description = "A notebook experiment in round-trip semantic encryption"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "amiralimollaei" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "jupyter>=1.1.1",
    "notebook>=7.6.5",
    "numpy",
    "transformers>=5.23.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
